name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  audit:
    name: Dependency audit (prod, high and above)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails the workflow on any high or critical advisory reachable from a
      # production dependency. One advisory is ignored, in the root
      # package.json under `pnpm.auditConfig.ignoreGhsas`: the Next image
      # optimizer RCE (GHSA-2xp9-vwfh-vxw4), fixed only from 15.5.24. Both
      # apps set `images.unoptimized`, so the `/_next/image` route it lives
      # in is not served. Nothing else is ignored.
      - run: pnpm audit --prod --audit-level=high

  typescript:
    name: TypeScript (typecheck + lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Every workspace's unit tests. The `*.live.test.ts` files reach testnet
      # and skip themselves on SKIP_LIVE; turbo's strict env mode only hands a
      # task the variables turbo.json names, which is why `test` lists it.
      - run: pnpm test
        env:
          SKIP_LIVE: '1'
      - run: pnpm build
      # The e2e job starts the dapp from this build rather than making its
      # own: a second `next build` would be the slowest step in the pipeline.
      # `.next` is a dot-directory, which upload-artifact skips by default.
      - uses: actions/upload-artifact@v4
        with:
          name: dapp-build
          path: |
            apps/dapp/.next
            !apps/dapp/.next/cache
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: Browser smoke (Playwright)
    runs-on: ubuntu-latest
    needs: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dapp-build
          path: apps/dapp/.next
      - run: npx playwright install --with-deps chromium
        working-directory: apps/dapp
      # No wallet, no model key, no database; playwright.config.ts sets the
      # server env. `start` because the build was downloaded above.
      - run: pnpm test:e2e
        working-directory: apps/dapp
        env:
          E2E_SERVER: start
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/dapp/playwright-report/
          retention-days: 7
