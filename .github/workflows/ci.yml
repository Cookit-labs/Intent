name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  audit:
    name: Dependency audit (prod, critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails the workflow on any critical advisory reachable from a production
      # dependency. Gated at critical, not high, for now: the remaining highs
      # are fixed only in the Next 15 line and in the EVM wallet stack, and a
      # job that is red on every PR is a job nobody reads. Raise this to
      # `high` with the Next 15 upgrade. Two advisories are ignored, in the
      # root package.json under `pnpm.auditConfig.ignoreGhsas`, each with a
      # reason: GHSA-2xp9-vwfh-vxw4, the Next image optimizer RCE, fixed only
      # from 15.5.24 - both apps set `images.unoptimized`, so the
      # `/_next/image` route it lives in is not served; and
      # GHSA-p293-qw3h-jr36, an RCE that applies only to Windows-hosted
      # servers - the sites are built and served on Linux. Nothing else is
      # ignored.
      - run: pnpm audit --prod --audit-level=critical

  typescript:
    name: TypeScript (typecheck + lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Every workspace's unit tests. The `*.live.test.ts` files reach testnet
      # and skip themselves on SKIP_LIVE; turbo's strict env mode only hands a
      # task the variables turbo.json names, which is why `test` lists it.
      - run: pnpm test
        env:
          SKIP_LIVE: '1'
      - run: pnpm build
      # The e2e job starts the dapp from this build rather than making its
      # own: a second `next build` would be the slowest step in the pipeline.
      # `.next` is a dot-directory, which upload-artifact skips by default.
      - uses: actions/upload-artifact@v4
        with:
          name: dapp-build
          path: |
            apps/dapp/.next
            !apps/dapp/.next/cache
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: Browser smoke (Playwright)
    runs-on: ubuntu-latest
    needs: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dapp-build
          path: apps/dapp/.next
      - run: npx playwright install --with-deps chromium
        working-directory: apps/dapp
      # No wallet, no model key, no database; playwright.config.ts sets the
      # server env. `start` because the build was downloaded above.
      - run: pnpm test:e2e
        working-directory: apps/dapp
        env:
          E2E_SERVER: start
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/dapp/playwright-report/
          retention-days: 7
