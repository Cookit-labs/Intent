name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  typescript:
    name: TypeScript (typecheck + lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Every workspace's unit tests. The `*.live.test.ts` files reach testnet
      # and skip themselves on SKIP_LIVE; turbo's strict env mode only hands a
      # task the variables turbo.json names, which is why `test` lists it.
      - run: pnpm test
        env:
          SKIP_LIVE: '1'
      - run: pnpm build
